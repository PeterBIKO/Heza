[project]
name = "heza"
version = "1.0.0"
description = "Multi-vendor hotel, lodge, resort and event-venue booking marketplace"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
