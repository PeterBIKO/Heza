# Local stack: PostgreSQL + Redis + Heza on http://localhost:8742 with demo data.
#   docker compose up --build
# Production overrides live in docker-compose.prod.yml (see docs/deployment.md).

x-app: &app
  build: .
  image: heza:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DEBUG: ${DEBUG:-True}
    SECRET_KEY: ${SECRET_KEY:-compose-dev-only-change-me}
    DATABASE_URL: postgres://${POSTGRES_USER:-heza}:${POSTGRES_PASSWORD:-heza}@db:5432/${POSTGRES_DB:-heza}
    CACHE_URL: redis://redis:6379/1
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8742,http://127.0.0.1:8742}
    SITE_URL: ${SITE_URL:-http://localhost:8742}
    USE_SQLITE: "False"
    MEDIA_ROOT: /app/media
    PRIVATE_MEDIA_ROOT: /app/private_media
  volumes:
    - media:/app/media
    - private_media:/app/private_media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heza}
      POSTGRES_DB: ${POSTGRES_DB:-heza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "8742:8742"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8742), 2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *app
    command: ["sh", "-c", "while true; do python manage.py heza_maintenance; sleep 300; done"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private_media:
