# Production overrides: Nginx terminates HTTPS in front of Gunicorn; the app port is not published.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
# Requires in .env.production: SECRET_KEY, POSTGRES_PASSWORD, DOMAIN, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, SITE_URL,
# EMAIL_URL, FLUTTERWAVE_* keys. Certificates are expected in ./deploy/certs (see docs/deployment.md).

x-prod-env: &prod-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
  DATABASE_URL: postgres://${POSTGRES_USER:-heza}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-heza}
  CACHE_URL: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
  SITE_URL: ${SITE_URL:?Set SITE_URL}
  USE_SQLITE: "False"
  SECURE_SSL: "True"
  USE_X_FORWARDED_FOR: "True"
  FORWARDED_ALLOW_IPS: "*"
  PAYMENT_PROVIDERS_ENABLED: ${PAYMENT_PROVIDERS_ENABLED:-flutterwave}
  MEDIA_ROOT: /app/media
  PRIVATE_MEDIA_ROOT: /app/private_media

services:
  db:
    ports: !reset []

  web:
    environment:
      <<: *prod-env
      RUN_MIGRATIONS: "1"
      SEED_DEMO: "0"
    ports: !reset []
    expose:
      - "8742"
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - static:/app/staticfiles-shared
    command: ["sh", "-c", "cp -r /app/staticfiles/. /app/staticfiles-shared/ && exec gunicorn heza.wsgi:application -c deploy/gunicorn.conf.py"]

  scheduler:
    environment:
      <<: *prod-env

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./deploy/nginx/docker.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    restart: unless-stopped

volumes:
  static:
