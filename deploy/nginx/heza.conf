# Host Nginx for a VPS install (systemd + Gunicorn). Replace heza.example.com and the /srv/heza paths.
limit_req_zone $binary_remote_addr zone=heza_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=heza_hooks:10m rate=120r/m;

upstream heza_app {
    server 127.0.0.1:8742;
    keepalive 16;
}

server {
    listen 80;
    server_name heza.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name heza.example.com;

    ssl_certificate     /etc/letsencrypt/live/heza.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heza.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) so Django can trust the value: USE_X_FORWARDED_FOR=True.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location /static/ {
        alias /srv/heza/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/heza/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        # Uploaded files are images only; never execute or render anything else.
        location ~* \.(php|html?|svg|js)$ { return 403; }
    }

    location ~ ^/(accounts/(login|register|password-reset)|partner/(login|register))/ {
        limit_req zone=heza_auth burst=10 nodelay;
        proxy_pass http://heza_app;
    }

    location /payments/webhooks/ {
        limit_req zone=heza_hooks burst=60 nodelay;
        proxy_pass http://heza_app;
    }

    location / {
        proxy_pass http://heza_app;
    }
}
