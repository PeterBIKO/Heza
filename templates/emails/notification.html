<!doctype html>
<html><body style="margin:0;background:#f6f1e8;font-family:Inter,Arial,sans-serif;color:#14201c">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0"><tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:14px;overflow:hidden">
<tr><td style="background:#1f4d3f;padding:18px 28px;color:#fff;font-family:Georgia,serif;font-size:24px;font-weight:700">heza<span style="color:#c8963e">.</span></td></tr>
<tr><td style="padding:28px">
<h1 style="font-family:Georgia,serif;font-size:22px;margin:0 0 16px">{{ subject }}</h1>

<p style="color:#6b7a74;font-size:13px;margin-top:24px">— The Heza team · support@heza.rw</p>
</td></tr></table>
</td></tr></table>
</body></html>
