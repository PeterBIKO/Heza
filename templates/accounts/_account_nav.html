{% load i18n %}
<div class="list-group mb-4">
  {% if user.is_customer %}
  <a class="list-group-item list-group-item-action {% if active == 'bookings' %}active{% endif %}" href="{% url 'bookings:mine' %}"><i class="bi bi-suitcase2 me-2"></i>{% translate "My bookings" %}</a>
  <a class="list-group-item list-group-item-action {% if active == 'favorites' %}active{% endif %}" href="{% url 'public:favorites' %}"><i class="bi bi-heart me-2"></i>{% translate "Favourites" %}</a>
  {% endif %}
  <a class="list-group-item list-group-item-action {% if active == 'notifications' %}active{% endif %}" href="{% url 'accounts:notifications' %}"><i class="bi bi-bell me-2"></i>{% translate "Notifications" %}</a>
  <a class="list-group-item list-group-item-action {% if active == 'profile' %}active{% endif %}" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>{% translate "Profile" %}</a>
  <a class="list-group-item list-group-item-action {% if active == 'password' %}active{% endif %}" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i>{% translate "Password" %}</a>
</div>
